<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Portal Acadêmico DevOps</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header class="topo">
 <h1>Portal Acadêmico DevOps</h1>
 <p>Ambiente de serviços acadêmicos e colaboração.</p>
 <div class="botoes-topo">
 <button id="botaoDestaque">Ver serviços</button>
 <button id="botaoTema">Modo Escuro</button>
 </div>
 </header>

 <main>
 <section id="servicos" class="secao">
 <h2>Serviços disponíveis</h2>
 <div class="cards">
 <article class="card">
 <h3>Matrícula</h3>
 <p>Orientações sobre matrícula e documentação.</p>
 </article>
 <article class="card">
 <h3>Calendário</h3>
 <p>Datas importantes do período letivo.</p>
 </article>
 <article class="card">
 <h3>Atendimento</h3>
 <p>Canal para dúvidas e solicitações.</p>
 </article>
 </div>
 </section>

<section class="secao">
<h2>Contato</h2>
<form id="formContato">
<label for="nome">Nome</label>
<input id="nome" type="text" placeholder="Digite seu nome">

<label for="sobrenome">Sobrenome</label>
<input id="sobrenome" type="text" placeholder="Digite seu sobrenome">

<label for="matricula">Matrícula</label>
<input id="matricula" type="text" placeholder="Digite sua matrícula">

<label for="email">E-mail</label>
<input id="email" type="email" placeholder="Digite seu e-mail">

<label for="mensagem">Mensagem</label>
<textarea id="mensagem" placeholder="Digite sua solicitação"></textarea>

<div class="grupo-botoes-contato">
<input type="file" id="arquivoAnexo" style="display: none;">
<button type="button" id="botaoAnexar" onclick="document.getElementById('arquivoAnexo').click()">Anexar Documentos</button>
<button type="submit">Enviar</button>
</div>
</form>
<p id="resposta"></p>
</section>
</main>
</body>
</html>
